name: NewTube
options:
  bundleIdPrefix: io.github.toofpaste
  deploymentTarget:
    iOS: "14.0"
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    revision: 7f75a2299dc329c0b7855afb25d47663a02855cb
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  NewTube:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, Browse.js]
      - path: App/Browse.js
        buildPhase: resources
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.toofpaste.newtube
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  NewTube:
    build:
      targets:
        NewTube: all
